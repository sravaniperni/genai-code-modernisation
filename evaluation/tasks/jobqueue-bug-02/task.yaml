id: jobqueue-bug-02
repo: jobqueue
category: bug_fix
split: heldout
title: Retries wait one backoff step too long
request: |
  Failed jobs are retried later than the retry policy says. `RetryPolicy` documents that the first retry
  waits `base_delay` and each further retry multiplies the wait by `factor`, capped at `max_delay`, but every
  retry currently waits one step longer.

  Example: `RetryPolicy(base_delay=5, factor=2)` should wait 5 s, 10 s, 20 s, 40 s before retries 1-4;
  `delay_for(1)` .. `delay_for(4)` return 10, 20, 40, 80 instead. In production a job with the default policy
  that fails once is rescheduled 10 s after the failure instead of 5 s, and with `max_delay` set the cap is
  reached one retry early. Jitter, when configured, should still spread around the documented values.
allowed_paths: ["src/**", "tests/**", "requirements.txt", "requirements-dev.txt", "pyproject.toml"]
notes: |
  The setup overlay uses factor ** retry_number instead of factor ** (retry_number - 1). The visible tests only
  check monotonicity, the cap and jitter bounds relative to the same (buggy) policy. Acceptance checks exact
  delays for several policies, the cap, base_delay=0, jittered bounds around the documented values and the
  run_at the executor assigns after successive failures.
