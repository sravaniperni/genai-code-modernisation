id: releasebot-dep-05
repo: releasebot
category: dependency_upgrade
split: heldout
title: Upgrade importlib-metadata to 7.2.1
request: |
  The plugin packages for releasebot (Slack, Matrix and Teams publishers) now depend on
  importlib-metadata 7.x, which makes our environment unresolvable while releasebot pins 4.13.0.
  Please upgrade importlib-metadata from 4.13.0 to 7.2.1 and pin it exactly in requirements.txt
  (`importlib-metadata==7.2.1`).

  Publisher plugins registered by installed distributions under the `releasebot.publishers` entry-point
  group must still be discovered, usable from `releasebot publish --publisher NAME` and listed by
  `releasebot publishers` together with the distribution that provides them. Broken entries (import
  errors, objects that are not publishers) must keep being skipped with a warning, and plugins must not
  be able to shadow built-in publishers.
allowed_paths: ["src/**", "tests/**", "requirements.txt", "requirements-dev.txt", "pyproject.toml"]
notes: |
  importlib-metadata 5.0 removed the SelectableGroups dict interface; releasebot.plugins calls
  entry_points().get(group), which raises AttributeError on 7.x. Acceptance installs a fake distribution
  (dist-info on sys.path) and checks discovery, origins, error handling, shadowing and CLI usage.
