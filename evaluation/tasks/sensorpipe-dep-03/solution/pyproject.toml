[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensorpipe"
version = "0.9.0"
description = "Industrial sensor data pipeline: ingestion, unit conversion, calibration, resampling, anomaly detection and reporting."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "packaging>=21",
    "ruamel.yaml>=0.18",
    "arrow>=0.17",
    "pydantic>=1.10",
    "click>=7.1",
    "semver>=2.13",
    "importlib-metadata>=4.6",
    "tzdata",
]

[project.scripts]
sensorpipe = "sensorpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sensorpipe.tables" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
