id: ledgerkit-dep-06
repo: ledgerkit
category: dependency_upgrade
split: heldout
title: Upgrade arrow to 1.3.0
request: |
  Please upgrade arrow from 0.17.0 to 1.3.0 and pin it exactly (`arrow==1.3.0`) in requirements.txt.
  0.17 is several years old, our test logs are full of its deprecation warnings, and the scheduling
  service that consumes ledgerkit's fiscal calendar requires arrow 1.3.

  `ledgerkit.periods.FiscalCalendar` must behave exactly as before:

  * fiscal years start on the first day of `first_month`, are named after the calendar year they start
    in, and are split into twelve monthly periods `FY<year>-P01` … `FY<year>-P12` with inclusive dates;
  * `boundaries(period)` returns the POSIX timestamps of the first and the last second of the period in
    the calendar's time zone, as whole seconds (`int`), including across daylight-saving changes;
  * `is_late(entry, period, grace_days)` is true only for entries dated inside the period whose
    `created_at` lies after the end of the `grace_days`-th day following the period end (in the
    calendar's time zone); naive `created_at` values are UTC, aware ones keep their offset.
allowed_paths: ["src/**", "tests/**", "requirements.txt", "requirements-dev.txt", "pyproject.toml"]
notes: |
  arrow 1.0 turned Arrow.timestamp from an int property into a float-returning method, so boundaries()
  returns bound methods and is_late() raises TypeError comparing them; int_timestamp keeps whole seconds.
  Acceptance checks the installed version, period generation, int boundaries in several zones (incl. DST)
  and late-entry detection for naive/aware timestamps.
