[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobqueue"
version = "0.9.2"
description = "A lightweight persistent job queue and scheduler"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[project.scripts]
jobqueue = "jobqueue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
